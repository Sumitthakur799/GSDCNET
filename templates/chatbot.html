<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Assistant — LeafCare AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated background -->
  <div class="bg-blur">
    <span class="blob blob1"></span>
    <span class="blob blob2"></span>
    <span class="blob blob3"></span>
  </div>
  <div class="floating-leaves">
    <span class="leaf leaf1">🍃</span>
    <span class="leaf leaf2">🍃</span>
    <span class="leaf leaf3">🌿</span>
    <span class="leaf leaf4">🍃</span>
    <span class="leaf leaf5">🌿</span>
  </div>

  <!-- Header with back button -->
  <header class="navbar chat-page-navbar">
    <a href="index.html" class="back-btn" aria-label="Back to home">←</a>
    <div class="logo">🌿 LeafCare AI</div>
  </header>

  <main class="container">
    <section class="card chat-card full-page-chat">
      <div class="chat-header">
        <div class="bot-avatar">🌱</div>
        <div>
          <h2>Plant Assistant</h2>
          <p class="chat-subtitle">Ask about symptoms, causes & treatment</p>
        </div>
      </div>
      <div class="chat-window" id="chatWindow">
        <div class="msg-row bot-row">
          <div class="bot-avatar small">🌱</div>
          <div class="bot-msg">Hi! Ask me about symptoms, causes, or treatment.</div>
        </div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type your question...">
        <button id="sendBtn" class="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12L21 3L13 21L11 13L3 12Z" fill="white"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <script src="chat.js"></script>
</body>
</html>
